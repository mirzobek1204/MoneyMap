<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PulPulse - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.page-auth {
      min-height: 100dvh;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }
    .auth-orb {
      position: fixed;
      top: -20%;
      right: -15%;
      width: min(600px, 120vw);
      height: min(600px, 120vw);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,74,255,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .auth-orb-b {
      top: auto;
      bottom: -20%;
      right: auto;
      left: -15%;
      background: radial-gradient(circle, rgba(0,200,150,0.10) 0%, transparent 70%);
    }
    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      backdrop-filter: blur(20px);
    }
    .auth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
    }
    .auth-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .auth-logo span { color: #7c5cfc; }
    .lang-select {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }
    .lang-select:focus { border-color: #7c5cfc; }
    .auth-title {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
      margin: 0 0 0.5rem;
    }
    .auth-sub {
      color: rgba(255,255,255,0.45);
      font-size: 0.9rem;
      margin: 0 0 2rem;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.4rem;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }
    .field input::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus { border-color: #7c5cfc; background: rgba(124,92,252,0.08); }
    .btn-primary {
      width: 100%;
      margin-top: 1.5rem;
      background: #7c5cfc;
      border: none;
      border-radius: 12px;
      padding: 0.95rem;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 100px;
      font-size: 0.875rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
      z-index: 9999;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="page-auth">
  <div class="auth-orb"></div>
  <div class="auth-orb auth-orb-b"></div>

  <div class="auth-card">
    <div class="auth-header">
      <p class="auth-logo">Pul<span>Pulse</span></p>
      <select class="lang-select" id="languageSelect" aria-label="Til tanlash">
        <option value="uz">O'zbek</option>
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <h1 class="auth-title" data-i18n="login.title">Xush kelibsiz 👋</h1>
    <p class="auth-sub" data-i18n="login.subtitle">Xarajatlaringizni sodda va tez kuzating.</p>

    <form id="loginForm">
      <div class="field">
        <label for="usernameInput" data-i18n="login.nameLabel">Ismingiz</label>
        <input type="text" id="usernameInput" name="username"
          autocomplete="username" autocapitalize="none" spellcheck="false"
          placeholder="Ismingizni kiriting"
          data-i18n-placeholder="login.namePlaceholder" required />
      </div>
      <div class="field">
        <label for="passwordInput" data-i18n="login.passwordLabel">Parol</label>
        <input type="password" id="passwordInput" name="password"
          autocomplete="current-password"
          placeholder="Parolni kiriting"
          data-i18n-placeholder="login.passwordPlaceholder"
          required minlength="4" />
      </div>
      <button class="btn-primary" type="submit" data-i18n="login.button">Kirish</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/core.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
