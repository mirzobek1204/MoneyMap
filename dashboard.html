<head>

<title>PulPulse - Dashboard</title>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #0a0a0f; color: #fff; min-height: 100dvh; overflow-x: hidden; }
.bg-static { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.bg-orb { position: absolute; border-radius: 50%; }
.orb-1 { top: -10%; right: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(99,74,255,0.15) 0%, transparent 70%); }
.orb-2 { bottom: 10%; left: -10%; width: 40vw; height: 40vw; background: radial-gradient(circle, rgba(0,200,140,0.08) 0%, transparent 70%); }
.shell { position: relative; z-index: 1; display: flex; min-height: 100dvh; }

.logo { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
.logo span { color: #7c5cfc; }

.btn-logout:hover { background: rgba(255,80,80,0.15); color: #ff6464; }
.main { flex: 1; padding: 1.75rem 1.5rem; max-width: 800px; }

.menu-btn { display: none; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 10px; width: 40px; height: 40px; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.topbar-title { flex: 1; }

.lang-box select:focus { border-color: #7c5cfc; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
.stat-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1rem 1.1rem; }

.panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.25rem; }
.panel h2 { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; margin-bottom: 1.25rem; color: rgba(255,255,255,0.85); }
.amount-hero { text-align: center; margin-bottom: 1.5rem; }
.amount-display { font-family: 'Syne', sans-serif; font-size: 3rem; font-weight: 800; color: #fff; letter-spacing: -0.03em; line-height: 1; min-height: 3.5rem; transition: color 0.2s; }
.amount-display.has-value { color: #a98fff; }
.amount-hint { font-size: 0.8rem; color: rgba(255,255,255,0.3); margin-top: 6px; }
.pills-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
.pill { padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; font-weight: 600; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
.pill.active { background: rgba(124,92,252,0.2); border-color: rgba(124,92,252,0.5); color: #c4aeff; }
.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.25rem; }
.num-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 500; height: 56px; cursor: pointer; transition: background 0.1s, transform 0.1s; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; }
.num-btn:active { background: rgba(124,92,252,0.2); transform: scale(0.95); }

.field-group input:focus, .field-group select:focus { border-color: #7c5cfc; }

.empty-state { text-align: center; padding: 2rem; color: rgba(255,255,255,0.25); font-size: 0.875rem; }
.toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(255,255,255,0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 0.75rem 1.5rem; border-radius: 100px; font-size: 0.875rem; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 9999; white-space: nowrap; }

.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; }
@media (max-width: 680px) {
  .sidebar { position: fixed; left: -220px; top: 0; height: 100dvh; z-index: 100; transition: left 0.3s ease; background: #0f0f1a; border-right-color: rgba(255,255,255,0.1); }
  .sidebar.open { left: 0; }
  .sidebar-overlay.show { display: block; }
  .menu-btn { display: flex; }
  .main { padding: 1.25rem 1rem; }
  .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-card { padding: 0.75rem 0.75rem; }
  .stat-value { font-size: 1rem; }
  .amount-display { font-size: 2.5rem; }
  .extra-fields { grid-template-columns: 1fr; }
  .note-field { grid-column: span 1; }
  .lang-box label { display: none; }
}
</style>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/core.js"></script>
<script>
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebarOverlay');
document.getElementById('topMenuBtn').addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', () => {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
});

document.getElementById('dateInput').valueAsDate = new Date();

let amountStr = '';
const display = document.getElementById('amountDisplay');
const amountHidden = document.getElementById('amountInput');
const amountHint = document.getElementById('amountHint');
let selectedCurrency = 'UZS';

function updateDisplay() {
  const val = amountStr || '0';
  const num = parseFloat(val);
  if (!amountStr || num === 0) {
    display.textContent = '0';
    display.classList.remove('has-value');
    amountHint.textContent = 'Miqdorni kiriting';
  } else {
    display.textContent = val + ' ' + selectedCurrency;
    display.classList.add('has-value');
    amountHint.textContent = '';
  }
  amountHidden.value = amountStr || '0';
}

document.getElementById('numpad').addEventListener('click', e => {
  const btn = e.target.closest('.num-btn');
  if (!btn) return;
  const key = btn.dataset.key;
  if (key === 'del') {
    amountStr = amountStr.slice(0, -1);
  } else if (key === '.') {
    if (!amountStr.includes('.')) amountStr += '.';
  } else {
    if (amountStr.length >= 12) return;
    amountStr += key;
  }
  updateDisplay();
});

document.getElementById('currencyPills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  selectedCurrency = pill.dataset.currency;
  document.getElementById('currencyInput').value = selectedCurrency;
  updateDisplay();
});

document.getElementById('saveExpenseBtn').addEventListener('click', () => {
  const amount = parseFloat(amountHidden.value);
  const date = document.getElementById('dateInput').value;
  const category = document.getElementById('categoryInput').value;
  const note = document.getElementById('noteInput').value;
  const currency = selectedCurrency;
  if (!amount || amount <= 0) { showToast('Miqdor kiriting!'); return; }
  if (!date) { showToast('Sana tanlang!'); return; }
  const evt = new CustomEvent('addExpense', { detail: { amount, currency, category, note, date } });
  document.dispatchEvent(evt);
  amountStr = '';
  document.getElementById('noteInput').value = '';
  document.getElementById('dateInput').valueAsDate = new Date();
  updateDisplay();
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
<script src="js/dashboard.js"></script>
</body>
</html>
